name: Chog Fight Club CI

on:
  push:
    branches: [discord-gate-invitations]
  pull_request:
    branches: [main, game-engine-foundation, discord-gate-invitations]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run mechanics, OpenSea and Discord auth tests
        run: npm test
      - name: Build app
        run: npm run build
