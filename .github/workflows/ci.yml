name: Chog Fight Club website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  website-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test website services
        run: npm test
      - name: Syntax-check Vercel API routes
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Cloudflare D1 migration
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect(":memory:")
          for path in ["migrations/0001_challenge_invites.sql", "migrations/0002_player_directory.sql"]:
              with open(path, encoding="utf-8") as migration:
                  db.executescript(migration.read())
          invites = db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name='chog_challenge_invites'").fetchone()
          players = db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name='chog_players'").fetchone()
          assert invites is not None, "D1 migration did not create chog_challenge_invites"
          assert players is not None, "D1 migration did not create chog_players"
          print("Both D1 migrations are valid SQLite and create their tables")
          PY
      - name: Build website
        run: npm run build
