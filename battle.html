<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practice Chog combat in the Phaser training arena." />
    <title>Practice Arena | Chog Fight Club</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090a0d; color: #f5f2ea; font-synthesis: none; text-rendering: optimizeLegibility; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090a0d; }
      body { min-width: 320px; min-height: 100dvh; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }
      .practice-header { position: fixed; z-index: 20; inset: 0 0 auto; min-height: 48px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(245,242,234,.3); background: rgba(9,10,13,.76); }
      .practice-header strong { font-size: 13px; letter-spacing: .08em; }
      .practice-header a { min-height: 44px; display: inline-flex; align-items: center; color: #f5f2ea; font-size: 13px; }
      .practice-header a:hover { color: #f0b53a; }
      .practice-main { position: fixed; inset: 0; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #111318; touch-action: none; }
      #game canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
      #game canvas:focus-visible { outline: 3px solid #f0b53a; outline-offset: -4px; }
      .keyboard-note { position: fixed; z-index: 20; left: 16px; bottom: 10px; max-width: calc(100vw - 32px); margin: 0; padding: 6px 9px; border-radius: 4px; background: rgba(9,10,13,.78); color: #f5f2ea; font-size: 12px; line-height: 1.45; }
      .practice-touch-controls { display: none; }
      .touch-group { display: flex; align-items: center; justify-content: center; gap: 6px; }
      .practice-touch-controls button { min-width: 46px; min-height: 48px; padding: 7px 8px; border: 1px solid #a38cff; border-radius: 8px; background: #211b31; color: #fff; font-size: 12px; font-weight: 700; touch-action: none; }
      .practice-touch-controls button[data-practice-action="special"] { border-color: #f0b53a; background: #f0b53a; color: #17130a; }
      .practice-touch-controls button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      @media (pointer: coarse), (max-width: 760px) {
        .keyboard-note { display: none; }
        .practice-touch-controls { position: fixed; z-index: 20; inset: auto 8px max(8px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: 8px; }
        .touch-group { min-width: 0; }
        .touch-group[aria-label="Combat actions"] { display: grid; grid-template-columns: repeat(4, minmax(42px, 1fr)); }
        .practice-touch-controls button { min-width: 0; width: 100%; }
      }
      @media (max-width: 440px) {
        .practice-header { min-height: 44px; padding-inline: 8px; }
        .practice-header strong { font-size: 10px; }
        .practice-header a { font-size: 11px; }
        .practice-touch-controls { inset-inline: 6px; gap: 5px; }
        .touch-group { gap: 4px; }
        .practice-touch-controls button { min-height: 44px; padding: 6px 4px; font-size: 10px; }
      }
      @media (max-width: 350px) { .practice-header strong { display: none; } .practice-header { justify-content: space-between; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <header class="practice-header">
      <a href="/play.html">Back to modes</a>
      <strong>CHOG FIGHT CLUB · PRACTICE</strong>
      <a href="/profile.html">Choose a Chog</a>
    </header>
    <main class="practice-main">
      <div id="game" role="img" aria-label="Chog Fight Club training arena. Use the listed keyboard or touch controls to move, duck, jump, attack, defend, and use abilities."></div>
      <p class="keyboard-note">Move: A/D or left/right arrows. Duck: S or down arrow. Jump: Space/W/up arrow. Basic: F. Base: 1. Special: 2. Defense: 3.</p>
      <section class="practice-touch-controls" aria-label="Touch controls for the practice arena">
        <div class="touch-group" aria-label="Movement">
          <button type="button" data-practice-hold="left" aria-label="Move left">LEFT</button>
          <button type="button" data-practice-hold="right" aria-label="Move right">RIGHT</button>
          <button type="button" data-practice-action="jump" aria-label="Jump">JUMP</button>
        </div>
        <div class="touch-group" aria-label="Combat actions">
          <button type="button" data-practice-action="basic" aria-label="Basic attack">BASIC</button>
          <button type="button" data-practice-action="base" aria-label="Use base ability">BASE</button>
          <button type="button" data-practice-action="special" aria-label="Use special ability">SPECIAL</button>
          <button type="button" data-practice-action="defense" aria-label="Defend">DEFEND</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
