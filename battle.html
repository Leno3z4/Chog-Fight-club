<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practice Chog combat in the Phaser training arena." />
    <title>Practice Arena | Chog Fight Club</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090a0d; color: #f5f2ea; font-synthesis: none; text-rendering: optimizeLegibility; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100dvh; background: #090a0d; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }
      .practice-header { width: min(calc(100vw - 24px), 1280px); min-height: 64px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #343840; }
      .practice-header strong { font-size: 13px; letter-spacing: .08em; }
      .practice-header a { color: #f5f2ea; font-size: 13px; }
      .practice-header a:hover { color: #f0b53a; }
      .practice-main { padding: 14px 0 20px; }
      #game { width: min(calc(100vw - 24px), 1280px, calc((100dvh - 190px) * 16 / 9)); aspect-ratio: 16 / 9; margin: 0 auto; overflow: hidden; border: 1px solid #535963; background: #111318; touch-action: none; }
      #game canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
      #game canvas:focus-visible { outline: 3px solid #f0b53a; outline-offset: -4px; }
      .keyboard-note { width: min(calc(100vw - 24px), 1280px); margin: 10px auto 0; color: #e4e2dc; font-size: 13px; line-height: 1.5; }
      .practice-touch-controls { display: none; }
      .touch-group { display: flex; align-items: center; justify-content: center; gap: 8px; }
      .practice-touch-controls button { min-width: 50px; min-height: 48px; padding: 8px 11px; border: 1px solid #a38cff; border-radius: 8px; background: #211b31; color: #fff; font-weight: 700; touch-action: none; }
      .practice-touch-controls button[data-practice-action="special"] { border-color: #f0b53a; background: #f0b53a; color: #17130a; }
      .practice-touch-controls button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      @media (pointer: coarse), (max-width: 760px) { .practice-touch-controls { width: min(calc(100vw - 24px), 1280px); margin: 12px auto 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; } .touch-group { flex-wrap: wrap; } }
      @media (max-width: 460px) { .practice-header strong { font-size: 11px; } .practice-header a { font-size: 12px; } .practice-touch-controls { justify-content: center; } .touch-group { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <header class="practice-header">
      <a href="/play.html">Back to modes</a>
      <strong>CHOG FIGHT CLUB · PRACTICE</strong>
      <a href="/profile.html">Choose a Chog</a>
    </header>
    <main class="practice-main">
      <div id="game" role="img" aria-label="Chog Fight Club training arena. Use the listed keyboard or touch controls to move, jump, attack, defend, and use abilities."></div>
      <p class="keyboard-note">Move: A and D or left and right arrows. Jump: Space, W, or up arrow. Basic: F. Base ability: 1. Special: 2. Defense: 3.</p>
      <section class="practice-touch-controls" aria-label="Touch controls for the practice arena">
        <div class="touch-group" aria-label="Movement">
          <button type="button" data-practice-hold="left" aria-label="Move left">LEFT</button>
          <button type="button" data-practice-hold="right" aria-label="Move right">RIGHT</button>
          <button type="button" data-practice-action="jump" aria-label="Jump">JUMP</button>
        </div>
        <div class="touch-group" aria-label="Combat actions">
          <button type="button" data-practice-action="basic" aria-label="Basic attack">BASIC</button>
          <button type="button" data-practice-action="base" aria-label="Use base ability">BASE</button>
          <button type="button" data-practice-action="special" aria-label="Use special ability">SPECIAL</button>
          <button type="button" data-practice-action="defense" aria-label="Defend">DEFEND</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
