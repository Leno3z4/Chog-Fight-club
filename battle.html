<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chog Fight Club prototype battle arena." />
    <title>Chog Fight Club — Battle</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111318; }

    </style>
  </head>
  <body>
    <a id="back-to-site" href="/">← Back to site</a>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
