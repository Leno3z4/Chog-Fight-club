<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chog Battle Arena — sign in to choose your Chog." />
  <title>Enter — Chog Battle Arena</title>
</head>
<body class="club-body login-body">
  <main class="login-shell">
    <div class="login-top"><a class="club-logo" href="/">CHOG <span>BATTLE ARENA</span></a></div>
    <section class="login-layout">
      <div class="login-copy">
        <h1>CHOOSE YOUR<br /><span>FIGHTER.</span></h1>
        
        
      </div>
      <div class="access-card">
        <div class="access-stamp">CBA <span>✦</span></div>
        <h2>Enter the arena</h2>
        <p>Connect your Discord account to continue. Link your wallet after you enter.</p>
        <button id="discord-connect" class="discord-button"><span class="discord-mark">◉</span><span>Connect Discord</span><b>↗</b></button>
        <div id="auth-status" class="auth-status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/login.js"></script>
</body>
</html>
