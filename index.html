<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chog Fight Club — holder-gated Chog battles." />
  <title>Enter the Club — Chog Fight Club</title>
</head>
<body class="club-body login-body">
  <main class="login-shell">
    <div class="login-top"><a class="club-logo" href="/">CHOG <span>FIGHT CLUB</span></a><span id="access-badge" class="live-pill"><i></i> MEMBER ACCESS</span></div>
    <section class="login-layout">
      <div class="login-copy">
        <h1>YOUR CHOG.<br /><span>YOUR FIGHT.</span></h1>
        <p class="login-lede">Step into the arena, choose your Chog, and settle your rivalries one challenge at a time.</p>
        <div class="login-points">
          <div><b>01</b><span>Connect Discord</span></div>
          <div><b>02</b><span>Choose your Chog</span></div>
        </div>
      </div>
      <div class="access-card">
        <div class="access-stamp">CFC <span>✦</span></div>
        <h2>Enter the club</h2>
        <p>Connect your Discord account to continue. Link your wallet after you enter.</p>
        <button id="discord-connect" class="discord-button"><span class="discord-mark">◉</span><span>Connect Discord</span><b>↗</b></button>
        <div id="auth-status" class="auth-status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/login.js"></script>
</body>
</html>
